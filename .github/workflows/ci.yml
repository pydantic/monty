name: ci

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request: {}
  workflow_dispatch:
    inputs:
      run_release:
        description: 'Run release jobs (for manual tag releases)'
        type: boolean
        default: false

permissions: {}

env:
  COLUMNS: 150
  UV_PYTHON: '3.14'
  UV_FROZEN: '1'
  DEBUG: 'napi:*'
  LLVM_COV_IGNORE_FILENAME_REGEX: '(tests/|test_cases/|/tests\.rs$$)'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # nightly is only used for `cargo +nightly fmt` (make format-rs); clippy must
      # run on stable. Install both toolchains, then explicitly set stable as the
      # default so bare `cargo clippy` (make lint-rs) resolves to stable — dtolnay's
      # install order alone does not reliably control which toolchain is the default.
      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: nightly
          components: rustfmt

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: clippy

      - name: Set stable as the default toolchain (clippy on stable; fmt pins +nightly)
        run: rustup default stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true
          prefix-key: 'v1-rust'

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - run: uv sync --all-packages --only-dev

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0 # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/monty-js/package-lock.json

      - name: Install node dependencies
        run: npm install
        working-directory: crates/monty-js

      - name: Run prek
        uses: j178/prek-action@cbc2f23eb5539cf20d82d1aabd0d0ecbcc56f4e3 # v2.2
        env:
          SKIP: no-commit-to-branch

      # the protobuf schema and the checked-in prost output must never drift
      - name: Check generated protobuf code is in sync
        run: make check-proto

      - name: Check vendored typeshed stubs are in sync
        run: make check-typeshed

  # The interpreter itself, under every feature config. Each `--features` flag
  # forces a full rebuild of `monty`, so the three configs are kept together
  # here; the crates layered on top run in parallel in `test-rust-crates`.
  test-rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: llvm-tools

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true

      - uses: taiki-e/install-action@1ed3272338f573e042a2e6bca3893aa19f43b47a # v2.71.3
        with:
          tool: cargo-llvm-cov

      # this means pyo3 will use Python 3.14 in tests
      - name: set up python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - run: rustc --version --verbose
      - run: python3 -V
      - run: cargo llvm-cov clean --workspace

      # coverage for `make test-no-features`
      # `test-rust-os` has no Linux entry, so this is the only Linux run of
      # monty-fs: its race soaks are enabled here or they never run on Linux.
      - run: cargo llvm-cov --no-report -p monty -p monty-fs
        env:
          MONTY_FS_SOAK: '1'
      - run: cargo llvm-cov run --no-report -p monty-datatest
      # coverage for `make test-memory-model-checks`
      - run: cargo llvm-cov --no-report -p monty --features memory-model-checks
      - run: cargo llvm-cov run --no-report -p monty-datatest --features memory-model-checks
      # coverage for `make test-ref-count-return`
      - run: cargo llvm-cov --no-report -p monty --features ref-count-return
      - run: cargo llvm-cov run --no-report -p monty-datatest --features ref-count-return
      # Generating text report:
      - run: cargo llvm-cov report --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX"
      # Generate codecov report (use `report` subcommand to avoid recompilation)
      - run: cargo llvm-cov report --codecov --output-path=rust-coverage.json --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-coverage-report
          path: rust-coverage.json
          if-no-files-found: error

  # The crates layered on top of the interpreter: the type checker (which does
  # not depend on `monty` at all), the subprocess stack and the docs harness.
  # They build `monty` only with default features, so this job pays no
  # feature-flag rebuilds and runs in parallel with `test-rust`.
  test-rust-crates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: llvm-tools

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true

      - uses: taiki-e/install-action@1ed3272338f573e042a2e6bca3893aa19f43b47a # v2.71.3
        with:
          tool: cargo-llvm-cov

      # this means pyo3 will use Python 3.14 in tests
      - name: set up python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - run: rustc --version --verbose
      - run: python3 -V
      - run: cargo llvm-cov clean --workspace

      # coverage for `make test-type-checking`
      - run: cargo llvm-cov --no-report -p monty-type-checking -p monty-typeshed
      # subprocess protocol + child mode + worker pool. The pool tests spawn a
      # real `monty` binary: build it plainly first (outside the llvm-cov
      # target dir) and point the tests at it explicitly.
      - run: cargo build -p monty-runtime
      - run: cargo llvm-cov --no-report -p monty-proto -p monty-runtime -p monty-pool
        env:
          MONTY_TEST_BIN: ${{ github.workspace }}/target/debug/monty
      - name: Compile Rust documentation examples
        run: cargo test --doc -p monty-doctest
      # Generating text report:
      - run: cargo llvm-cov report --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX"
      # Generate codecov report (use `report` subcommand to avoid recompilation)
      - run: cargo llvm-cov report --codecov --output-path=rust-crates-coverage.json --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-crates-coverage-report
          path: rust-crates-coverage.json
          if-no-files-found: error

  test-python-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: llvm-tools

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true

      - uses: taiki-e/install-action@1ed3272338f573e042a2e6bca3893aa19f43b47a # v2.71.3
        with:
          tool: cargo-llvm-cov

      - name: set up python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - run: rustc --version --verbose
      - run: python3 -V
      - run: uv sync --all-packages --only-dev

      # the tests need the `monty` worker binary on PATH; build it from the
      # workspace (plain build, outside the llvm-cov env, so the worker binary
      # is not instrumented)
      - run: uv run maturin develop --uv -m crates/monty-runtime/Cargo.toml

      - name: Build and test Python bindings and run pytest with Rust coverage
        run: |
          set -euxo pipefail
          eval "$(cargo llvm-cov show-env --export-prefix)"
          cargo llvm-cov clean --workspace
          uv run maturin develop --uv -m crates/monty-python/Cargo.toml
          uv run --package pydantic-monty-client --only-dev pytest crates/monty-python/tests
          cargo llvm-cov report --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX"
          cargo llvm-cov report --codecov --output-path=python-rust-coverage.json --ignore-filename-regex "$LLVM_COV_IGNORE_FILENAME_REGEX"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-rust-coverage-report
          path: python-rust-coverage.json
          if-no-files-found: error

  coverage-upload:
    runs-on: ubuntu-latest
    needs:
      - test-rust
      - test-rust-crates
      - test-python-coverage

    permissions:
      # Needed to download coverage report artifacts from the coverage producer jobs.
      contents: read
      actions: read
      # Needed by getsentry/codecov-action when posting the single PR coverage comment.
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-coverage-report'
          merge-multiple: true
          path: coverage-reports

      - name: List coverage reports
        run: ls -lh coverage-reports

      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: coverage-reports/rust-coverage.json,coverage-reports/rust-crates-coverage.json,coverage-reports/python-rust-coverage.json
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          name: rust-coverage

      - uses: getsentry/codecov-action@03112cc3b486a3397dc8d17a58680008721fc86f # 0.3.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: coverage-reports/rust-coverage.json,coverage-reports/rust-crates-coverage.json,coverage-reports/python-rust-coverage.json
          disable-search: true
          coverage-format: codecov
          post-pr-comment: true
          name: rust-coverage

  test-python:
    name: test python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - run: uv sync --all-packages --only-dev
      - run: make dev-py
      - run: make pytest
        # also test with a release build
      - run: make dev-py-release
      - run: make pytest
        # test uv run exercise script
      - run: uv run --no-sync crates/monty-python/exercise.py

  test-rust-os:
    name: test rust on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true

      - name: set up python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - run: cargo test -p monty --features memory-model-checks
      # monty-fs does host filesystem I/O, so its mount/path-security tests must
      # pass on all three OSes (it has no memory-model-checks feature — the
      # mount table never touches the interpreter heap).
      - run: cargo test -p monty-fs
      # The two race soaks are opt-in so a local `cargo test -p monty-fs` does
      # not pay ~5s for them, but they are regression guards on the
      # descriptor-relative open and the FIFO re-check, so CI must run them.
      - name: Test monty-fs race soaks
        run: cargo test -p monty-fs --test mount_confinement
        env:
          MONTY_FS_SOAK: '1'
      - run: cargo run -p monty-datatest --features memory-model-checks
      - run: cargo build -p monty-runtime
      - name: Test subprocess crates (Unix)
        if: runner.os != 'Windows'
        run: cargo test -p monty-proto -p monty-runtime -p monty-pool
        env:
          MONTY_TEST_BIN: ${{ github.workspace }}/target/debug/monty
      - name: Test subprocess crates (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p monty-proto -p monty-runtime -p monty-pool
        env:
          MONTY_TEST_BIN: ${{ github.workspace }}\target\debug\monty.exe

  bench-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true

      - name: set up python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - run: make dev-bench

  miri:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true

      - name: Run miri tests
        run: make miri

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - tokens_input_panic
          # disable until https://github.com/astral-sh/ruff/issues/23198 is fixed
          # - string_input_panic

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: nightly

      - id: cache-rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true
          prefix-key: 'v1-rust-fuzz'
          workspaces: 'crates/fuzz -> target'

      - if: steps.cache-rust.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz

      - name: Run ${{ matrix.target }} fuzzer
        run: |
          # Use --sanitizer none to avoid ASAN/SanitizerCoverage linking issues on CI
          # (undefined __sancov_gen_.* symbols). For short CI runs, we're mainly
          # catching panics, not memory bugs.
          cargo fuzz run --fuzz-dir crates/fuzz --sanitizer none ${{ matrix.target }} -- -max_total_time=60

  # https://github.com/marketplace/actions/alls-green#why used for branch protection checks
  check:
    if: always()
    needs:
      - lint
      - test-rust
      - test-rust-crates
      - test-python-coverage
      - coverage-upload
      - test-rust-os
      - test-python
      - test-js
      - test-browser
      - bench-test
      - fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

  # Build source distribution
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          command: sdist
          args: --out dist
          rust-toolchain: stable
          working-directory: crates/monty-python

      - uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          command: sdist
          args: --out dist
          rust-toolchain: stable
          working-directory: crates/monty-runtime

      # the sdist carries only the client crate and its Rust path dependencies,
      # so its build.rs must not reach for anything else in the workspace —
      # check that here rather than discovering it from a PyPI install
      - name: check the client sdist builds standalone
        run: |
          mkdir sdist-check
          tar -xzf crates/monty-python/dist/pydantic_monty_client-*.tar.gz -C sdist-check --strip-components=1
          cargo check --manifest-path sdist-check/crates/monty-python/Cargo.toml

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      # the `pydantic-monty` metapackage is pure metadata pinning the client and
      # runtime distributions, so one sdist plus one universal wheel cover every
      # platform and Python version
      - name: build metapackage
        run: uv build --out-dir dist
        working-directory: packages/pydantic-monty

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi_files-cli-sdist
          path: crates/monty-runtime/dist

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi_files-sdist
          path: crates/monty-python/dist

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi_files-meta
          path: packages/pydantic-monty/dist

  # Build extension wheels and one runtime wheel for every supported platform
  build:
    name: build on ${{ matrix.os }} (${{ matrix.target }} - ${{ matrix.manylinux || 'auto' }})
    # only run on push to main, on tags, or if 'Full Build' label is present
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'Full Build') || (github.event_name == 'workflow_dispatch' && inputs.run_release)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target: x86_64
            pgo-runtime: true
            pgo-args: --pgo -i /opt/uv-python/cpython-3.14-linux-x86_64-gnu/bin/python3.14
          - os: linux
            target: aarch64
            runs-on: ubuntu-24.04-arm
            pgo-runtime: true
            pgo-args: --pgo -i /opt/uv-python/cpython-3.14-linux-aarch64-gnu/bin/python3.14
          - os: linux
            target: i686
            pgo-runtime: false
          - os: linux
            target: armv7
            pgo-runtime: false
          - os: linux
            target: ppc64le
            pgo-runtime: false
          - os: linux
            target: s390x
            pgo-runtime: false
          - os: linux
            target: x86_64
            manylinux: musllinux_1_1
            pgo-runtime: false
          - os: linux
            target: aarch64
            manylinux: musllinux_1_1
            pgo-runtime: false
          - os: macos
            target: aarch64
            pgo-runtime: true
            pgo-args: --pgo -i python
          - os: macos
            target: x86_64
            pgo-runtime: false
          - os: windows
            target: x86_64
            pgo-runtime: false
          - os: windows
            target: i686
            pgo-runtime: false

    runs-on: ${{ matrix.runs-on || (matrix.os == 'linux' && 'ubuntu-latest') || (matrix.os == 'macos' && 'macos-latest') || (matrix.os == 'windows' && 'windows-latest') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: build Python wheels
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'manylinux_2_28' }}
          args: --release --out dist -i 3.10 3.11 3.12 3.13 3.14
          rust-toolchain: stable
          docker-options: -e CI
          working-directory: crates/monty-python

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi_files-python-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'manylinux' }}
          path: crates/monty-python/dist

      # Maturin performs one PGO cycle for bin bindings for all versions (runtime is not
      # tied to the Python ABI).
      - name: build runtime wheel
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1.50.1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'manylinux_2_28' }}
          # `uv` provides Python 3.14 inside the manylinux container. Maturin
          # needs its full path; the `3.14` selector does not search uv installs.
          before-script-linux: |
            if [[ "$PGO_RUNTIME" == 'true' ]]; then
              curl -LsSf https://astral.sh/uv/install.sh | env UV_UNMANAGED_INSTALL=/usr/local/bin sh
              UV_PYTHON_INSTALL_DIR=/opt/uv-python uv python install 3.14
            fi
          args: --release ${{ matrix.pgo-args }} --out dist
          rust-toolchain: stable
          rustup-components: ${{ matrix.pgo-runtime && 'llvm-tools-preview' || '' }}
          docker-options: -e CI -e UV_PYTHON -e PGO_RUNTIME
          working-directory: crates/monty-runtime
        env:
          PGO_RUNTIME: ${{ matrix.pgo-runtime }}

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi_files-runtime-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'manylinux' }}
          path: crates/monty-runtime/dist

  # Test wheels on exotic architectures via QEMU
  test-builds-arch:
    name: test build on ${{ matrix.target }}
    needs: [build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, armv7, s390x, ppc64le]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi_files-*-linux-${{ matrix.target }}-*
          merge-multiple: true
          path: dist

      - uses: uraimo/run-on-arch-action@d94c13912ea685de38fccc1109385b83fd79427d # v3.0.1
        name: install & test
        with:
          arch: ${{ matrix.target }}
          distro: ubuntu22.04
          dockerRunArgs: --volume "${{ github.workspace }}/dist:/dist"
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python3-venv
          run: |
            ls -lh /dist/
            python3 -m venv venv
            source venv/bin/activate
            python3 -m pip install typing_extensions
            python3 -m pip install pydantic-monty-client pydantic-monty-runtime --no-index --no-deps --find-links /dist --force-reinstall
            python3 - <<'EOF'
            from pydantic_monty import Monty

            with Monty() as pool:
                with pool.checkout() as session:
                    assert session.feed_run('1 + 2') == 3
            print('worker pool OK')
            EOF

  # Test wheels on main OS platforms
  test-builds-os:
    name: test build on ${{ matrix.os }}
    needs: [build]
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-latest
          - os: macos
            runs-on: macos-latest
          - os: windows
            runs-on: windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi_files-*-${{ matrix.os }}-*
          merge-multiple: true
          path: dist

      - run: pip install typing_extensions
      - run: pip install pydantic-monty-client --no-index --no-deps --find-links dist --force-reinstall
      - run: python -c "import pydantic_monty; print(pydantic_monty.__version__)"

      # the cli wheel built for this platform must serve the worker pools
      - run: pip install pydantic-monty-runtime --no-index --no-deps --find-links dist --force-reinstall
      - name: smoke test worker pools
        shell: bash
        run: |
          python - <<'EOF'
          import asyncio
          from pydantic_monty import AsyncMonty, Monty

          with Monty() as pool:
              with pool.checkout() as session:
                  assert session.feed_run('1 + 2') == 3

          async def main():
              async with AsyncMonty() as pool:
                  async with pool.checkout() as session:
                      assert await session.feed_run('1 + 2') == 3

          asyncio.run(main())
          print('worker pools OK')
          EOF

  # Inspect built artifacts
  inspect-python-assets:
    needs: [build, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi_files-*
          merge-multiple: true
          path: dist

      - name: list files
        run: |
          ls -lhR dist/
          ls -1 dist/ | wc -l
          echo "Expected 76 files (5 Python versions × 12 platform variants + 12 runtime wheels + 2 sdists + 2 metapackage files)"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - run: uvx twine check --strict dist/*

  # Release to PyPI
  release-python:
    name: release to PyPI
    needs: [check, inspect-python-assets, test-builds-arch, test-builds-os]
    if: success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.run_release))
    runs-on: ubuntu-latest

    environment:
      name: release-python
      url: https://pypi.org/project/pydantic-monty/${{ steps.check-version.outputs.VERSION }}

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi_files-*
          merge-multiple: true
          path: dist

      - id: check-version
        uses: samuelcolvin/check-python-version@ee87cddb8049d2694cc03badc8569765a05cef00 # v5
        with:
          version_file_path: 'Cargo.toml'

      - name: check the pydantic-monty metapackage version
        uses: samuelcolvin/check-python-version@ee87cddb8049d2694cc03badc8569765a05cef00 # v5
        with:
          version_file_path: 'packages/pydantic-monty/pyproject.toml'

      - run: ls -lhR dist/

      - name: Publish to PyPI
        run: 'uv publish --trusted-publishing always dist/*'

  release-crates:
    name: release to crates.io
    needs: [check, release-python]
    if: success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.run_release))
    runs-on: ubuntu-latest

    environment:
      name: release-crates
      url: https://crates.io/crates/monty/${{ steps.check-version.outputs.VERSION }}

    # trusted publishing to crates.io via OIDC, no long-lived token required
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      # exchanges the GitHub OIDC token for a short-lived crates.io token,
      # exported as CARGO_REGISTRY_TOKEN for the publish step
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - id: check-version
        uses: samuelcolvin/check-python-version@ee87cddb8049d2694cc03badc8569765a05cef00 # v5
        with:
          version_file_path: 'Cargo.toml'

      # Publishes every workspace member that is not `publish = false` (i.e. all
      # the library/bin crates, but not the `pydantic-monty-client`/`monty-js` bindings,
      # which ship to PyPI/npm). `--workspace` publishes in dependency order and
      # waits for each crate to land in the index before publishing dependents.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  test-js:
    name: test JS on ${{ matrix.os }} - node@${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node:
          - '20'
          - '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0  # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: crates/monty-js/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: crates/monty-js

      # the workers the JS client drives
      - name: Build the monty binary
        run: cargo build -p monty-runtime

      # debug napi build + TypeScript; tests and the smoke test load it
      - name: Build
        run: npm run build:debug
        working-directory: crates/monty-js

      - name: Lint
        run: npm run lint
        working-directory: crates/monty-js

      # Point the workers at the binary just built above, not the published
      # platform package `npm install` pulled in — otherwise `npm test`
      # silently runs a stale binary at the same version (see `make test-js`).
      - name: Test
        run: npm test
        working-directory: crates/monty-js
        env:
          MONTY_BIN: ${{ github.workspace }}/target/debug/monty${{ runner.os == 'Windows' && '.exe' || '' }}

  # Release builds of the napi shared library for each npm platform package.
  # The worker executables are reused from the pydantic-monty-runtime wheels.
  build-js-binaries:
    name: build JS addon - ${{ matrix.settings.triple }}
    runs-on: ${{ matrix.settings.host }}
    # only run on push to main, on tags, or if 'Full Build' label is present
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'Full Build') || (github.event_name == 'workflow_dispatch' && inputs.run_release)

    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            triple: darwin-x64
          - host: macos-latest
            target: aarch64-apple-darwin
            triple: darwin-arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            triple: win32-x64-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            triple: linux-arm64-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true
          prefix-key: v1-rust-js-bin

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install node dependencies
        run: npm install
        working-directory: crates/monty-js

      - name: Build the napi shared library
        run: npx napi build --platform --release --esm --target ${{ matrix.settings.target }}
        working-directory: crates/monty-js

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: monty-addon-${{ matrix.settings.triple }}
          path: crates/monty-js/monty.${{ matrix.settings.triple }}.node
          if-no-files-found: error

  build-wasm:
    name: build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-dependency-path: crates/monty-js/package-lock.json

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true
          prefix-key: 'v1-wasm32-wasip1'

      - name: Install dependencies
        run: npm install
        working-directory: crates/monty-js

      - name: Build wasm package assets and verify generated declarations
        run: make check-wasm-types

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wasm-bindings
          path: crates/monty-js/dist/worker/component
          if-no-files-found: error
    env:
      CARGO_INCREMENTAL: '1'

  test-browser:
    name: test browser
    needs:
      - build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0  # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/monty-js/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: crates/monty-js

      - name: Build TypeScript
        run: npm run build:ts
        working-directory: crates/monty-js

      - name: Download wasm component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-bindings
          path: crates/monty-js/dist/worker/component

      # the wasm specs are node-only, and this is the job that has the module
      - name: Test wasm module in node
        run: npm run test:wasm
        working-directory: crates/monty-js

      - name: Test browser bindings
        run: npx playwright install --with-deps chromium && npm run test:browser
        working-directory: crates/monty-js

  assemble-js-packages:
    name: assemble JS packages
    needs:
      - build
      - build-js-binaries
      - build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install
        working-directory: crates/monty-js

      # Generates the native loader and all TypeScript entry points. The host
      # addon is discarded; platform addons come from build-js-binaries.
      - name: Build main package
        run: npm run build
        working-directory: crates/monty-js

      - name: Download native addon artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: monty-addon-*
          path: crates/monty-js/artifacts

      - name: Download runtime wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi_files-runtime-*
          path: crates/monty-js/artifacts

      - name: Download wasm component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-bindings
          path: crates/monty-js/dist/worker/component

      - name: Assemble, validate, and pack
        run: npm run assemble-packages
        working-directory: crates/monty-js

      - name: Upload package tarballs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: js-package-tarballs
          path: crates/monty-js/package-tarballs/*.tgz
          if-no-files-found: error

  test-js-packages:
    name: test ${{ matrix.platform.triple }} JS package on node@${{ matrix.node }}
    needs:
      - assemble-js-packages
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
        platform:
          - os: macos-15-intel
            triple: darwin-x64
          - os: macos-latest
            triple: darwin-arm64
          - os: ubuntu-latest
            triple: linux-x64-gnu
          - os: ubuntu-24.04-arm
            triple: linux-arm64-gnu
          - os: windows-latest
            triple: win32-x64-msvc
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Download package tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-package-tarballs
          path: crates/monty-js/package-tarballs

      - name: Install packed packages
        run: npm install ../package-tarballs/monty-main.tgz ../package-tarballs/monty-${{ matrix.platform.triple }}.tgz --force --no-save --no-package-lock
        working-directory: crates/monty-js/smoke-test

      - name: Import package and run a worker
        run: node package-smoke.mjs
        working-directory: crates/monty-js/smoke-test

  release-js:
    name: Release to NPM
    runs-on: ubuntu-latest
    needs:
      - check
      - test-js
      - test-js-packages
      - test-browser
      - release-python
    if: success() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.run_release))
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Download tested package tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-package-tarballs
          path: package-tarballs

      - name: Publish tested tarballs
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publishing stable release"
            TAG_ARG=()
          else
            echo "Publishing pre-release with 'next' tag"
            TAG_ARG=(--tag next)
          fi
          for tarball in ./package-tarballs/monty-{darwin,linux,win32}-*.tgz; do
            npm publish "$tarball" --provenance --access public "${TAG_ARG[@]}"
          done
          npm publish ./package-tarballs/monty-main.tgz --provenance --access public "${TAG_ARG[@]}"
