name: CodSpeed

# Every mode runs in this one workflow so a commit gets a single CodSpeed run holding
# all its instruments; separate workflows made separate runs, and a PR could then be
# compared against a main run that lacked its instrument and carried stale values.
#
# Simulation and memory run everywhere. Walltime needs the CodSpeed bare-metal runner,
# so it is opt-in on a PR through the `Full Codspeed` label, and `labeled` is a trigger.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  SAVE_CI_CACHE: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'Save CI cache') }}

jobs:
  build-worker:
    name: Build release worker (x86_64)
    # Adding any other label must not rerun the benchmarks; `benchmarks` follows this one.
    if: github.event.action != 'labeled' || github.event.label.name == 'Full Codspeed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: worker-x86_64
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Artifacts are only used for benchmarks in this workflow run
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: ${{ env.SAVE_CI_CACHE }}

      - name: Build native release worker
        run: cargo build --release --locked --no-default-features -p monty-runtime

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codspeed-worker-x86_64
          path: target/release/monty
          if-no-files-found: error
          retention-days: 7

  benchmarks:
    name: Run benchmarks (${{ matrix.mode }})
    needs: [build-worker]
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, memory]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true
          key: ${{ matrix.mode }}
          cache-workspace-crates: true
          save-if: ${{ env.SAVE_CI_CACHE }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-codspeed@5.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codspeed-worker-x86_64
          path: worker

      # Artifact downloads do not preserve executable permissions.
      - name: Make worker executable
        run: chmod +x worker/monty

      # Keep production codegen and symbols for CodSpeed's flamegraphs.
      - name: Build benchmarks
        env:
          MODE: ${{ matrix.mode }}
        run: cargo codspeed build -m "$MODE" -p monty-bench --profile codspeed --no-default-features --features codspeed

      # Disable ASLR for benchmark processes and their worker children.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: ${{ matrix.mode }}
          run: setarch $(uname -m) -R cargo codspeed run -p monty-bench
        env:
          MONTY_TEST_BIN: ${{ github.workspace }}/worker/monty

  build-worker-aarch64:
    name: Build release worker (aarch64)
    # Only a labelled PR, and not a rerun for some other label being added to it; `walltime` follows this one.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'Full Codspeed')
      && (github.event.action != 'labeled' || github.event.label.name == 'Full Codspeed')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: worker-aarch64
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Artifacts are only used for benchmarks in this workflow run
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: ${{ env.SAVE_CI_CACHE }}

      # manylinux keeps the executable compatible with the Ubuntu 22.04 runner.
      - name: Build release worker wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64
          manylinux: manylinux_2_28
          args: --release --locked --no-default-features --out dist
          rust-toolchain: stable
          working-directory: crates/monty-runtime

      - name: Extract worker executable
        run: |
          mkdir -p worker
          unzip -p crates/monty-runtime/dist/*.whl '*.data/scripts/monty' > worker/monty

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codspeed-worker-aarch64
          path: worker/monty
          if-no-files-found: error
          retention-days: 7

  walltime:
    name: Run benchmarks (walltime)
    needs: [build-worker-aarch64]
    # Keep the baseline on the same bare-metal Graviton hardware.
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true
          key: walltime
          cache-workspace-crates: true
          save-if: ${{ env.SAVE_CI_CACHE }}

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-codspeed@5.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codspeed-worker-aarch64
          path: worker

      # Artifact downloads do not preserve executable permissions.
      - name: Make worker executable
        run: chmod +x worker/monty

      # Keep production codegen and symbols for CodSpeed's flamegraphs.
      - name: Build benchmarks
        run: cargo codspeed build -m walltime -p monty-bench --profile codspeed --no-default-features --features codspeed

      # Fixed malloc thresholds prevent earlier benchmarks from changing later costs.
      # Disable ASLR for benchmark processes and their worker children.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: walltime
          run: setarch $(uname -m) -R cargo codspeed run -p monty-bench
        env:
          MONTY_TEST_BIN: ${{ github.workspace }}/worker/monty
          GLIBC_TUNABLES: glibc.malloc.mmap_threshold=33554432:glibc.malloc.trim_threshold=67108864
