name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SAVE_CI_CACHE: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'Save CI cache') }}

jobs:
  build-worker:
    name: Build release worker (${{ matrix.target }})
    strategy:
      matrix:
        target: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["x86_64", "aarch64"]' || '["x86_64"]') }}
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: worker-${{ matrix.target }}
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Artifacts are only used for benchmarks in this workflow run
          cache-on-failure: true
          cache-workspace-crates: true
          save-if: ${{ env.SAVE_CI_CACHE }}

      # Build on the faster runner, but target a glibc baseline supported by the
      # Ubuntu 22.04 measurement runner. Keep release codegen, without PGO.
      - name: Build release worker wheel
        if: matrix.target == 'aarch64'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: manylinux_2_28
          args: --release --out dist
          rust-toolchain: stable
          working-directory: crates/monty-runtime

      # Simulation and memory share a native worker built on the same Ubuntu image.
      - name: Build native release worker
        if: matrix.target == 'x86_64'
        run: |
          cargo build --release --locked --no-default-features -p monty-runtime
          mkdir -p crates/monty-runtime/dist
          cp target/release/monty crates/monty-runtime/dist/monty

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codspeed-worker-${{ matrix.target }}
          path: crates/monty-runtime/dist/
          if-no-files-found: error
          retention-days: 7

  benchmarks:
    name: Run benchmarks (${{ matrix.mode }})
    needs: [build-worker]
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["simulation", "memory", "walltime"]' || '["simulation", "memory"]') }}
    # Keep the walltime baseline on the same bare-metal Graviton hardware.
    runs-on: ${{ matrix.mode == 'walltime' && 'codspeed-macro-arm64-graviton-ubuntu-22-04' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # no release versioning, see https://github.com/dtolnay/rust-toolchain/issues/180
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions
          cache-on-failure: true
          key: ${{ matrix.mode }}
          cache-workspace-crates: true
          save-if: ${{ env.SAVE_CI_CACHE }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.mode == 'walltime'
        with:
          python-version: '3.14'

      # Pinned so a rust-cache hit can't silently keep serving an old binary
      # (older versions lack `--profile` and build without the workspace's
      # LTO settings, skewing benchmark numbers).
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-codspeed@5.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codspeed-worker-${{ matrix.mode == 'walltime' && 'aarch64' || 'x86_64' }}
          path: worker-artifacts

      # MONTY_TEST_BIN prevents the pool benchmarks from building a worker mid-run.
      # Each mode uses an optimized worker built for its architecture.
      - name: Install the release worker wheel
        if: matrix.mode == 'walltime'
        run: |
          python -m venv worker
          worker/bin/python -m pip install --no-deps worker-artifacts/*.whl

      - name: Install the native release worker
        if: matrix.mode != 'walltime'
        run: |
          mkdir -p worker/bin
          install -m 755 worker-artifacts/monty worker/bin/monty

      # No `--bench` filter: build and run every monty-bench target. The
      # `codspeed` profile (root Cargo.toml) is release codegen — fat LTO,
      # one codegen unit — with symbols kept for CodSpeed's flamegraphs, so
      # measurements reflect the optimization level users actually run.
      # The `codspeed` feature selects codspeed-criterion-compat and drops the
      # CPython comparisons in all measurement modes.
      - name: Build benchmarks
        env:
          MODE: ${{ matrix.mode }}
        run: |
          SECONDS=0
          cargo codspeed build -m "$MODE" -p monty-bench --profile codspeed --no-default-features --features codspeed
          echo "Benchmark build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Record benchmark start
        id: benchmark-start
        run: echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Every benchmark in a target runs in one process, so glibc's malloc
      # state carries over between them. By default glibc raises its mmap and
      # trim thresholds on the fly, based on what has been freed so far, so a
      # benchmark's cost depended on which benchmarks ran before it: with a
      # low trim threshold, freeing the heap at the end of each iteration
      # gives the memory back to the OS (`systrim`) and the next iteration
      # page-faults it in again (pair_tuples went from 38 ms to 51 ms when
      # unrelated benchmarks were removed). Setting the thresholds turns the
      # dynamic adjustment off. The values are the ceilings the heuristic
      # reaches in a long-running process (32 MiB mmap, twice that for trim).
      # Fixed malloc thresholds apply only to walltime measurements.
      #
      # ASLR picks one of several memory layouts per process, which moves the
      # allocation-heavy benchmarks 10-40% between runs of identical code. The
      # `-R` personality is inherited by the pool's worker children too.
      # Same fix as https://github.com/pydantic/jiter/pull/284
      - name: Run benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          mode: ${{ matrix.mode }}
          run: setarch $(uname -m) -R cargo codspeed run -p monty-bench
        env:
          MONTY_TEST_BIN: ${{ github.workspace }}/worker/bin/monty
          GLIBC_TUNABLES: ${{ matrix.mode == 'walltime' && 'glibc.malloc.mmap_threshold=33554432:glibc.malloc.trim_threshold=67108864' || '' }}

      - name: Report benchmark duration
        if: always() && steps.benchmark-start.outputs.timestamp != ''
        env:
          STARTED: ${{ steps.benchmark-start.outputs.timestamp }}
          MODE: ${{ matrix.mode }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          echo "Benchmark run ($MODE), including CodSpeed setup and upload: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
