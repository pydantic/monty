<?xml version="1.0" encoding="UTF-8"?>
<!--
  Original line art for the Monty antigravity example, in the spirit of
  xkcd 353 (https://xkcd.com/353/) but not traced from it.

  The host translates `#char` by the offset the sandbox computes, and extends
  `#trail` with the points it has visited.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <g id="scene" fill="none" stroke="#1b1b1d" stroke-width="1.4" stroke-linecap="round">
    <line x1="8" y1="146" x2="232" y2="146" />
    <polyline id="trail" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 3" points="" />
  </g>
  <g id="char" fill="none" stroke="#1b1b1d" stroke-width="1.6" stroke-linecap="round">
    <circle cx="60" cy="104" r="7.5" />
    <line x1="60" y1="111.5" x2="60" y2="128" />
    <polyline points="45,111 60,118 75,111" />
    <polyline points="52,146 60,128 68,146" />
  </g>
</svg>
