# CPython stdlib modules Monty vendors as CPython's own Python source.
# Edit this file, then run `make vendor-stdlib`; `make check-stdlib` verifies the vendored copies.
# `patches/*.patch` stack: each applies, in file-name order, on top of the ones before it. To add one, edit `Lib/`,
# then run `uv run scripts/vendor_stdlib.py --make-patch NNNN-name --reason '...'`, which saves only the edits the
# earlier patches do not make; it can add a new last patch or replace the last one, not an earlier one.
# `make check-stdlib-patches` fails once a patch is no longer needed: its module's `<module>__module.py` passes without it;
# a `Permanent: <why>` line in a patch's reason exempts it.
# Run `make stdlib-candidates` to see which modules Monty can load, and what blocks the rest.

# The CPython release the files below are copied from, and the commit its tag points to. Files are fetched by
# commit, so moving the tag cannot change them; update both together
# (`gh api repos/python/cpython/commits/<tag> --jq .sha` gives the commit).
