[package]
name = "wire-protocol"
description = "Python bindings to encode/decode the Monty subprocess wire protocol over any transport"
readme = "README.md"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[lib]
name = "_wire_protocol"
# cdylib: the `_wire_protocol` Python extension module.
# rlib: lets `monty-python` (and other Rust crates) link the value-conversion
# layer (`convert`/`dataclass`/`exceptions`) directly instead of duplicating it.
crate-type = ["cdylib", "rlib"]

[dependencies]
ahash = { workspace = true }
monty = { path = "../monty" }
monty-proto = { path = "../monty-proto" }
num-bigint = { workspace = true }
prost = { workspace = true }
pyo3 = { version = "0.28", features = ["indexmap", "generate-import-lib", "num-bigint"] }

[build-dependencies]
pyo3-build-config = { version = "0.28", features = ["resolve-config"] }

[features]
# make extensions visible to cargo vendor
extension-module = ["pyo3/generate-import-lib"]

[lints]
workspace = true
