[package]
name = "monty-runtime"
readme = "README.md"
version = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "monty"
path = "src/main.rs"

[dependencies]
# Terminal styling for the CLI: `anstream` resolves NO_COLOR/CLICOLOR/tty and
# enables virtual-terminal mode on Windows, `anstyle` builds the styles. Both
# already ship inside clap's dependency tree.
anstream = "0.6"
anstyle = "1"
clap = { workspace = true }
# The standalone CLI owns process-level telemetry configuration.
logfire = { version = "0.11", default-features = false, features = ["export-http-protobuf"] }
monty = { workspace = true }
monty-fs = { workspace = true }
monty-alloc = { workspace = true, features = ["exit-code"] }
monty-proto = { workspace = true, features = ["worker"] }
monty-type-checking = { workspace = true }
monty-types = { workspace = true }
rustyline = "15"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
