[package]
name = "monty-js"
description = "Node.js/TypeScript bindings for the Monty sandboxed Python interpreter"
readme = "README.md"
# Distributed as a napi-rs native addon on npm, not as a crate on crates.io.
publish = false
version = { workspace = true }
rust-version = { workspace = true }
# napi-derive's generated code is not yet edition-2024 clean
edition = "2021"
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[lib]
crate-type = ["cdylib"]

[dependencies]
monty-types = { workspace = true }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
monty-pool = { workspace = true, features = ["telemetry-adapter"] }
monty-type-checking = { workspace = true }
napi = { version = "3.8", default-features = false, features = ["napi8", "compat-mode", "tokio_rt"] }
# The pool is async; the binding shares napi's tokio runtime and only needs
# the sync primitives (the per-session checkout mutex) itself.
tokio = { workspace = true, features = ["sync", "time"] }
napi-derive = "3.0.0"
num-bigint = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
