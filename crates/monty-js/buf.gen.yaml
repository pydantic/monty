# Generates src/generated/monty/v1/monty_pb.ts from monty-proto's schema.
# Run via `npm run generate-proto`; CI verifies the output is in sync
# (`make check-proto-js`), mirroring the checked-in prost code in monty-proto.
version: v2
inputs:
  - directory: ../monty-proto/proto
plugins:
  - local: protoc-gen-es
    out: src/generated
    opt: target=ts
