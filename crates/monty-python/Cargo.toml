[package]
name = "pydantic-monty-client"
description = "Python client for the Monty sandboxed Python interpreter"
readme = "README.md"
# Distributed as a PyO3 extension wheel on PyPI, not as a crate on crates.io.
publish = false
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[lib]
name = "_monty"
# The `_monty` Python extension module (the actual deliverable).
crate-type = ["cdylib"]

[dependencies]
ahash = { workspace = true }
monty-pool = { workspace = true, features = ["telemetry"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
monty-proto = { workspace = true, features = ["python"] }
monty-types = { workspace = true }
monty-fs = { workspace = true }
pyo3 = { workspace = true, features = ["indexmap", "generate-import-lib", "num-bigint"] }
num-bigint = { workspace = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
# just enough to host the runtime pyo3-async-runtimes drives
# (rt-multi-thread is needed for `block_in_place` in `block_on_sync`)
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[features]
# make extensions visible to cargo vendor
extension-module = ["pyo3/generate-import-lib"]

[lints]
workspace = true
