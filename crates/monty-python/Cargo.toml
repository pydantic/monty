[package]
name = "pydantic-monty-client"
description = "Python client for the Monty sandbox"
readme = "README.md"
# Distributed as a PyO3 extension wheel on PyPI, not as a crate on crates.io.
publish = false
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
repository = { workspace = true }

[lib]
name = "_monty"
# The `_monty` Python extension module (the actual deliverable).
crate-type = ["cdylib"]

[dependencies]
ahash = { workspace = true }
jiff = { workspace = true }
monty-pool = { workspace = true, features = ["telemetry"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
monty-proto = { workspace = true, features = ["python"] }
monty-types = { workspace = true, features = ["tzdb"] }
monty-fs = { workspace = true }
pyo3 = { workspace = true, features = ["experimental-async", "indexmap", "generate-import-lib", "num-bigint"] }
num-bigint = { workspace = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
futures-util = { workspace = true }
# Protocol I/O and timers; async Python tasks poll the driver themselves.
# rt-multi-thread also supports `block_in_place` in `block_on_sync`.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[features]
# make extensions visible to cargo vendor
extension-module = ["pyo3/generate-import-lib"]

[lints]
workspace = true
