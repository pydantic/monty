[package]
name = "monty-macros"
readme = "README.md"
version = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Procedural macros for the monty Python interpreter."
repository = { workspace = true }

[lib]
proc-macro = true

[features]
native-signatures = ["dep:monty-typeshed", "dep:ruff_python_ast", "dep:ruff_python_parser", "dep:ruff_text_size"]

[dependencies]
monty-typeshed = { workspace = true, optional = true }
ruff_text_size = { workspace = true, optional = true }
ruff_python_ast = { workspace = true, optional = true }
ruff_python_parser = { workspace = true, optional = true }
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
