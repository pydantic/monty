[package]
name = "monty-bench"
version = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Benchmarks for the Monty interpreter — compares Monty vs CPython"
publish = false

[features]
# Runs the `main` bench under the worker's global allocator (`monty-alloc`)
# instead of `System`, to price the hard memory ceiling on real workloads.
worker-alloc = ["dep:monty-alloc"]
# Set by the CodSpeed workflow: report through `codspeed-criterion-compat` and
# leave out the CPython comparisons. A feature rather than `cfg(codspeed)`,
# which `cargo codspeed` sets only for simulation builds, not walltime ones.
codspeed = []

[dependencies]
monty = { workspace = true, features = ["test-hooks"] }
monty-types = { workspace = true }
monty-fs = { workspace = true }
monty-fixture = { path = "../monty-fixture" }
monty-alloc = { workspace = true, optional = true }
monty-pool = { workspace = true }
monty-proto = { workspace = true }
# The pool benchmarks use Criterion's Tokio async executor.
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
pyo3 = { workspace = true, features = ["auto-initialize"] }
tempfile = { workspace = true }
codspeed-criterion-compat = { version = "5.0.1", features = ["async_tokio"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[[bench]]
name = "main"
harness = false

[[bench]]
name = "pool"
harness = false

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
