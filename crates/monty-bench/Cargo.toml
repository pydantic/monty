[package]
name = "monty-bench"
version = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "Benchmarks for the Monty interpreter — compares Monty vs CPython"
publish = false

[dependencies]
monty = { workspace = true, features = ["test-hooks"] }
monty-types = { workspace = true }
monty-pool = { workspace = true }
monty-proto = { workspace = true }
# The pool benchmarks use Criterion's Tokio async executor.
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
pyo3 = { workspace = true, features = ["auto-initialize"] }
codspeed-criterion-compat = { version = "4.2.1", features = ["async_tokio"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[build-dependencies]
pyo3-build-config = { workspace = true }

[[bench]]
name = "main"
harness = false

[[bench]]
name = "pool"
harness = false

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
