[package]
name = "monty-type-checking"
readme = "README.md"
version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
description = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
repository = { workspace = true }

[lib]
name = "monty_type_checking"
path = "src/lib.rs"

[dependencies]
ruff_python_ast = { workspace = true }
ruff_python_parser = { workspace = true }
ruff_text_size = { workspace = true }
# Optional: ty and what it needs, for the `checker` feature
monty-types = { workspace = true, optional = true }
monty-typeshed = { workspace = true, optional = true }
ruff_python_stdlib = { workspace = true, optional = true }
ruff_db = { workspace = true, optional = true }
ty_python_semantic = { workspace = true, optional = true }
ty_python_core = { workspace = true, optional = true }
ty_module_resolver = { workspace = true, optional = true }
salsa = { workspace = true, optional = true }

[features]
default = ["checker"]
# The type checker itself (ty). Without it the crate offers only `scan_imports`,
# which needs nothing but the parser the interpreter already links: a worker that
# delegates checks to its host (monty-proto's `host-type-checking`) uses that.
checker = [
    "dep:monty-types",
    "dep:monty-typeshed",
    "dep:ruff_python_stdlib",
    "dep:ruff_db",
    "dep:ty_python_semantic",
    "dep:ty_python_core",
    "dep:ty_module_resolver",
    "dep:salsa",
]

[dev-dependencies]
insta = { workspace = true }
# Use codspeed-criterion-compat for CI benchmarks, real criterion for local flamegraphs
codspeed-criterion-compat = "6.0.0"
# pprof 0.15's profiler integration requires Criterion 0.5.
criterion = "0.5"

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[[bench]]
name = "type_check"
harness = false
required-features = ["checker"]

[[test]]
name = "main"
required-features = ["checker"]

[lints]
workspace = true
