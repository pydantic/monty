[package]
name = "monty-wasm-runtime"
# Used by the monty-js build which is distributed via npm, not crates.io
publish = false
version = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "WebAssembly component that drives a Monty protocol child one turn per call."
keywords = { workspace = true }
categories = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[lib]
# A component whose instance retains one protocol child across exported calls.
crate-type = ["cdylib"]

[dependencies]
monty-alloc = { workspace = true }
monty-proto = { workspace = true, features = ["worker"] }
monty-types = { workspace = true }
wit-bindgen = "0.46"

[lints]
workspace = true
